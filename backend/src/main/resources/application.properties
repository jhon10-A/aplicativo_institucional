# Start from backend/ to load the external ignored configuration.
spring.config.import=optional:file:./config/application-local.properties
spring.application.name=backend

spring.datasource.url=jdbc:mariadb://localhost:3306/db_institucional
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Authentication: the signing key is required via JWT_SECRET_BASE64.
app.jwt.ttl-seconds=3600
app.dev.seed-enabled=false
spring.mvc.log-request-details=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc=OFF
