
# Start from backend/ to load the external ignored configuration.
spring.config.import=optional:file:./config/application-local.properties

spring.application.name=backend

# One private attachment per submission; application validation caps it at 5 MiB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.submissions.storage=./storage/entregas

# Conexion a MySQL 8.4 - Puerto 3307
spring.datasource.url=jdbc:mysql://localhost:3307/db_institucional
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Authentication: the signing key is required via JWT_SECRET_BASE64.
app.jwt.ttl-seconds=3600
app.dev.seed-enabled=false

spring.mvc.log-request-details=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc=OFF
